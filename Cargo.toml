[package]
name = "mget"
version = "0.1.0"
edition = "2024"
description = "An intelligent multi-source downloader for large language models"
license = "MIT"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
indicatif = "0.18"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
