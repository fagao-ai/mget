<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 背景 -->
  <rect width="512" height="512" rx="128" fill="#030712"/>
  
  <defs>
    <!-- 霓虹流光渐变 -->
    <linearGradient id="swiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <!-- 霓虹光晕 -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景微弱的光晕，增加科技感 -->
  <path d="M 160 280 C 160 170 200 170 225 220 L 256 280 L 287 220 C 312 170 352 170 352 280" 
        fill="none" stroke="url(#swiftGrad)" stroke-width="32" stroke-linecap="round" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- 主体 M 型流线 -->
  <path d="M 160 280 C 160 170 200 170 225 220 L 256 280 L 287 220 C 312 170 352 170 352 280" 
        fill="none" stroke="url(#swiftGrad)" stroke-width="24" stroke-linecap="round"/>

  <!-- 下载箭头（流线的终点与交汇处） -->
  <g fill="url(#swiftGrad)">
    <!-- 箭头尾部稍微加粗 -->
    <circle cx="256" cy="275" r="12" />
    <!-- 箭头尖端 -->
    <path d="M 220 275 L 292 275 L 256 325 Z" stroke-linejoin="round" stroke-width="8" stroke="url(#swiftGrad)"/>
  </g>
</svg>
