name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: mget
            asset_name: mget-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: mget.exe
            asset_name: mget-windows-amd64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: mget
            asset_name: mget-darwin-amd64
          - os: macos-15-intel
            target: aarch64-apple-darwin
            artifact_name: mget
            asset_name: mget-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9A-Za-z.-]+)?([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $GITHUB_REF_NAME is not a supported version" >&2
            exit 1
          fi

          # Cargo accepts three numeric components plus prerelease/build metadata.
          # A long tag such as v0.2.0.20261022 becomes 0.2.0-20261022 for Cargo,
          # while MGET_VERSION keeps the full tag for `mget --version`.
          if [[ "$release_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.([0-9A-Za-z][0-9A-Za-z.-]*)$ ]]; then
            cargo_version="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          else
            cargo_version="$release_version"
          fi

          python_cmd=python3
          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            python_cmd=python
          fi

          "$python_cmd" - "$cargo_version" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          path = "Cargo.toml"
          text = open(path, encoding="utf-8").read()
          text, count = re.subn(
              r'(?m)^(version\s*=\s*")[^"]+(")',
              lambda match: f"{match.group(1)}{version}{match.group(2)}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not find the [package] version in Cargo.toml")
          open(path, "w", encoding="utf-8").write(text)
          PY

          cargo update --package mget --precise "$cargo_version"

          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | "$python_cmd" -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])'
          )"
          if [[ "$package_version" != "$cargo_version" ]]; then
            echo "Cargo version $package_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

          echo "MGET_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "Building mget $release_version (Cargo version $cargo_version)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        shell: bash
        run: |
          set -o pipefail
          if ! cargo build --release --target ${{ matrix.target }} 2>&1 | tee build.log; then
            message="$(tail -n 25 build.log | tr '\n' ' ' | cut -c1-3500)"
            echo "::error title=Cargo build failed::$message"
            exit 1
          fi

      - name: Strip binary (linux)
        if: matrix.os == 'ubuntu-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          chmod +x ${{ matrix.artifact_name }}
          cp ${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          cp ${{ matrix.artifact_name }} ${{ matrix.asset_name }}.exe

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}.exe

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/mget-linux-amd64/mget-linux-amd64
            artifacts/mget-darwin-amd64/mget-darwin-amd64
            artifacts/mget-darwin-arm64/mget-darwin-arm64
            artifacts/mget-windows-amd64/mget-windows-amd64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
